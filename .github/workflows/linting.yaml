name: Linting
# Workflow temporarily disabled
# on:
#     pull_request:
#         branches:
#             - develop
#             - master
jobs:
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x]
        # Commented out environment variables since we're not using them yet
        # env:
        #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #     NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun i
            - run: bun lint
            - run: bun lint:style
            # - run: bun run test
